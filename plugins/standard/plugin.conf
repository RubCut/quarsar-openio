# Standard quasar_openio plugin manifest.
# The supervisor only launches this binary with a mode argument and forwards
# button events on stdin. The binary draws BOTH outputs itself through validated
# framebuffer mmap: screen fb4 and ring fb5. The ring is used only by animations.
format=quasar-plugin-v1
name=standard
binary=quasar_pack
idle=clock
music=visualizer
animations=music-play,music-pause,mic-on,mic-off,volume-up,volume-down,volume-ring,plasma,rainbow,starfield,pulse,rain
